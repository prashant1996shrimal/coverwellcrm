<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coverwell CRM - Call Logs</title>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Ari
            
            al, sans-serif;
        }

/* MAIN */

        .main {
            margin-left: 240px;
            min-height: 100vh;
        } 

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        /* Header */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title h1 {
            color: #1e293b;
            font-size: 28px;
        }

        .title p {
            color: #64748b;
            margin-top: 6px;
        }

        .back-button {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-button:hover {
            background: #1d4ed8;
        }

        /* Statistics */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .stat-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            color: #1e293b;
            font-size: 28px;
        }

        /* Main card */

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        /* Toolbar */

        .toolbar {
            padding: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2e8f0;
        }

        .search {
            flex: 1;
            min-width: 260px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .filter {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            outline: none;
        }

        .refresh {
            padding: 12px 18px;
            border: none;
            background: #0f172a;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Table */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8fafc;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 16px 15px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover {
            background: #f8fafc;
        }

        .employee-name {
            font-weight: bold;
            color: #1e293b;
        }

        .type {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 20px;
        }

        .outgoing {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .incoming {
            background: #dcfce7;
            color: #15803d;
        }

        .completed {
            background: #dcfce7;
            color: #15803d;
        }

        .missed {
            background: #fee2e2;
            color: #b91c1c;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 40px;
        }

        .loading,
        .empty {
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        /* Mobile */

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                align-items: flex-start;
                gap: 15px;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

        <!-- SIDEBAR -->
<div id="sidebar-container"></div>

<main class="main">

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div class="title">

                <h1>Call Logs</h1>

                <p>
                    Track employee calls and conversations
                </p>

            </div>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">

                <p>Total Calls</p>

                <h2 id="totalCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Outgoing</p>

                <h2 id="outgoingCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Incoming</p>

                <h2 id="incomingCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Missed</p>

                <h2 id="missedCalls">
                    0
                </h2>

            </div>

        </div>

        <div class="card employee-stats-card">

            <div class="employee-stats-header">
                <h2>Employee Call Statistics</h2>

                <button class="refresh" onclick="loadEmployeeStats()">
                    Refresh
                </button>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Total Calls</th>
                            <th>Outgoing</th>
                            <th>Incoming</th>
                            <th>Missed</th>
                        </tr>
                    </thead>

                    <tbody id="employeeStatsTable">

                        <tr>
                            <td colspan="5" class="loading">
                                Loading employee statistics...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>



        <!-- Main Card -->

        <div class="card">

            <!-- Toolbar -->

            <div class="toolbar">

                <input type="text" id="search" class="search" placeholder="Search employee or phone number...">
                <select id="employeeFilter" class="filter">

                    <option value="">
                        All Employees
                    </option>

                </select>

                <select id="typeFilter" class="filter">

                    <option value="">
                        All Call Types
                    </option>

                    <option value="OUTGOING">
                        Outgoing
                    </option>

                    <option value="INCOMING">
                        Incoming
                    </option>

                    <option value="MISSED">
                        Missed
                    </option>

                </select>


                <select id="statusFilter" class="filter">

                    <option value="">
                        All Status
                    </option>

                    <option value="COMPLETED">
                        Completed
                    </option>

                    <option value="MISSED">
                        Missed
                    </option>

                    <option value="PENDING">
                        Pending
                    </option>

                </select>


                <button class="refresh" onclick="loadCallLogs()">

                    Refresh

                </button>

            </div>


            <!-- Table -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Employee</th>

                            <th>Phone</th>

                            <th>Call Type</th>

                            <th>Call Start</th>

                            <th>Call End</th>

                            <th>Duration</th>

                            <th>Status</th>

                            <th>Notes</th>

                        </tr>

                    </thead>


                    <tbody id="callLogsTable">

                        <tr>

                            <td colspan="9" class="loading">

                                Loading call logs...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
    </main>


    <script>

        const API_URL =
            "http://localhost:8080";

        let callLogs = [];


        function loadEmployeeFilter() {

            const employeeFilter =
                document.getElementById("employeeFilter");

            const employees = [];

            callLogs.forEach(call => {

                if (call.employee) {

                    const exists =
                        employees.some(
                            employee =>
                                employee.id === call.employee.id
                        );

                    if (!exists) {
                        employees.push(call.employee);
                    }
                }

            });

            employeeFilter.innerHTML = `
        <option value="">All Employees</option>
    `;

            employees.forEach(employee => {

                const option =
                    document.createElement("option");

                option.value = employee.id;

                option.textContent =
                    employee.name;

                employeeFilter.appendChild(option);

            });
        }

        // Load call logs

        async function loadCallLogs() {

            const table = document.getElementById("callLogsTable");

            table.innerHTML = `
        <tr>
            <td colspan="9" class="loading">
                Loading call logs...
            </td>
        </tr>
    `;

            try {

                const response = await fetch(
                    "http://localhost:8080/api/call-logs"
                );

                if (!response.ok) {
                    throw new Error("Failed to load call logs");
                }

                callLogs = await response.json();

                updateStatistics();

                displayCallLogs(callLogs);

            } catch (error) {

                console.error(error);

                table.innerHTML = `
            <tr>
                <td colspan="9" class="error">
                    Unable to load call logs.
                </td>
            </tr>
        `;
            }
        }
        // Statistics

        async function updateStatistics() {

            try {

                const response = await fetch(
                    "http://localhost:8080/api/dashboard/stats"
                );

                if (!response.ok) {
                    throw new Error("Failed to load dashboard statistics");
                }

                const stats = await response.json();

                document.getElementById("totalCalls").textContent =
                    stats.totalCalls;

                document.getElementById("outgoingCalls").textContent =
                    stats.totalOutgoingCalls;

                document.getElementById("incomingCalls").textContent =
                    stats.totalIncomingCalls;

                document.getElementById("missedCalls").textContent =
                    stats.missedCalls;

            } catch (error) {

                console.error("Statistics error:", error);

            }
        }
        async function loadEmployees() {

            const employeeFilter =
                document.getElementById("employeeFilter");

            try {

                const response = await fetch(
                    `${API_URL}/api/employees`
                );

                if (!response.ok) {
                    throw new Error("Failed to load employees");
                }

                const employees = await response.json();

                employeeFilter.innerHTML = `
            <option value="">
                All Employees
            </option>
        `;

                employees.forEach(employee => {

                    const option =
                        document.createElement("option");

                    option.value = employee.id;

                    option.textContent = employee.name;

                    employeeFilter.appendChild(option);

                });

            } catch (error) {

                console.error(
                    "Employee loading error:",
                    error
                );

            }
        }

        // Format duration

        function formatDuration(seconds) {

            if (!seconds) {
                return "00:00";
            }


            const minutes =
                Math.floor(
                    seconds / 60
                );

            const remainingSeconds =
                seconds % 60;


            return (
                String(minutes)
                    .padStart(2, "0")
                +
                ":"
                +
                String(remainingSeconds)
                    .padStart(2, "0")
            );

        }


        // Format date

        function formatDate(dateString) {

            if (!dateString) {
                return "-";
            }


            const date =
                new Date(dateString);


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // Display calls

        function displayCallLogs(data) {

            const table =
                document.getElementById(
                    "callLogsTable"
                );


            if (!data || data.length === 0) {

                table.innerHTML = `
            <tr>
                <td colspan="9"
                    class="empty">
                    No call logs found.
                </td>
            </tr>
        `;

                return;
            }


            table.innerHTML = "";


            data.forEach(call => {

                const row =
                    document.createElement("tr");


                const employeeName =
                    call.employee
                        ? call.employee.name
                        : "Unknown";


                let typeClass = "";

                if (call.callType === "OUTGOING") {
                    typeClass = "outgoing";
                } else if (call.callType === "INCOMING") {
                    typeClass = "incoming";
                } else if (call.callType === "MISSED") {
                    typeClass = "missed";
                }


                let statusClass =
                    call.status
                        ? call.status.toLowerCase()
                        : "";


                row.innerHTML = `

            <td>
                ${call.id}
            </td>

            <td class="employee-name">
                ${employeeName}
            </td>

            <td>
                ${call.phoneNumber || "-"}
            </td>

            <td>

                <span class="type ${typeClass}">
                    ${call.callType || "-"}
                </span>

            </td>

            <td>
                ${formatDate(
                    call.callStart
                )}
            </td>

            <td>
                ${formatDate(
                    call.callEnd
                )}
            </td>

            <td>
                ${formatDuration(
                    call.durationSeconds
                )}
            </td>

            <td>

                <span class="type ${statusClass}">
                    ${call.status || "-"}
                </span>

            </td>

            <td>
                ${call.notes || "-"}
            </td>

        `;


                table.appendChild(row);

            });

        }

        async function loadEmployeeStats() {

            const table =
                document.getElementById("employeeStatsTable");

            table.innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                Loading employee statistics...
            </td>
        </tr>
    `;

            try {

                const response = await fetch(
                    `${API_URL}/api/call-logs/stats/employees`
                );

                if (!response.ok) {
                    throw new Error(
                        "Failed to load employee statistics"
                    );
                }

                const stats = await response.json();

                if (!stats || stats.length === 0) {

                    table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No employee statistics found.
                    </td>
                </tr>
            `;

                    return;
                }

                table.innerHTML = "";

                stats.forEach(employee => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                <td class="employee-name">
                    ${employee.employeeName}
                </td>

                <td>
                    ${employee.totalCalls}
                </td>

                <td>
                    ${employee.outgoingCalls}
                </td>

                <td>
                    ${employee.incomingCalls}
                </td>

                <td>
                    <span class="type missed">
                        ${employee.missedCalls}
                    </span>
                </td>

            `;

                    table.appendChild(row);

                });

            } catch (error) {

                console.error(
                    "Employee statistics error:",
                    error
                );

                table.innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    Unable to load employee statistics.
                </td>
            </tr>
        `;
            }
        }
        // Search + filters

        function applyFilters() {

            const search =
                document.getElementById(
                    "search"
                ).value
                    .toLowerCase()
                    .trim();

            const employeeId =
                document.getElementById(
                    "employeeFilter"
                ).value;

            const type =
                document.getElementById(
                    "typeFilter"
                ).value;


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                callLogs.filter(call => {


                    const matchesEmployee =
                        employeeId === "" ||
                        (
                            call.employee &&
                            String(call.employee.id) === employeeId
                        );

                    const employeeName =
                        call.employee
                            ? call.employee.name
                                .toLowerCase()
                            : "";


                    const phone =
                        String(
                            call.phoneNumber || ""
                        );


                    const matchesSearch =
                        employeeName.includes(search)
                        ||
                        phone.includes(search);


                    const matchesType =
                        type === ""
                        ||
                        call.callType === type;


                    const matchesStatus =
                        status === ""
                        ||
                        call.status === status;


                    return (
                        matchesSearch &&
                        matchesEmployee &&
                        matchesType &&
                        matchesStatus
                    );

                });


            displayCallLogs(
                filtered
            );

        }


        document
            .getElementById("search")
            .addEventListener(
                "input",
                applyFilters
            );

        document
            .getElementById("employeeFilter")
            .addEventListener(
                "change",
                applyFilters
            );

        document
            .getElementById("typeFilter")
            .addEventListener(
                "change",
                applyFilters
            );


        document
            .getElementById("statusFilter")
            .addEventListener(
                "change",
                applyFilters
            );


        // Start
        // callLogs = await response.json();

        loadEmployeeFilter();

        updateStatistics(callLogs);

        displayCallLogs(callLogs);
        loadCallLogs();
        loadEmployees();
        loadEmployeeStats();
    </script>


    <script src="js/sidebar.js"></script>


</body>

</html>
