<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coverwell CRM - Reports</title>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            min-height: 100vh;
        } 

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 28px;
        }

        .header p {
            color: #64748b;
            margin-top: 6px;
        }

        .back-button {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-button:hover {
            background: #1d4ed8;
        }

        /* Statistics */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .stat-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            color: #1e293b;
            font-size: 28px;
        }

        /* Main card */

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .toolbar {
            padding: 20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-bottom: 1px solid #e2e8f0;
        }

        .refresh {
            padding: 12px 18px;
            border: none;
            background: #0f172a;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .refresh:hover {
            background: #1e293b;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 16px 15px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover {
            background: #f8fafc;
        }

        .employee-name {
            font-weight: bold;
            color: #1e293b;
        }

        .number {
            font-weight: bold;
        }

        .missed {
            color: #dc2626;
            font-weight: bold;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 40px;
        }

        .loading,
        .empty {
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                align-items: flex-start;
                gap: 15px;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }
        }

        .filter {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>


<body>
<main class="main">

    <div id="sidebar-container"></div>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div>

                <h1>Reports</h1>

                <p>
                    Employee call performance report
                </p>

            </div>


        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">

                <p>Total Calls</p>

                <h2 id="totalCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Outgoing Calls</p>

                <h2 id="outgoingCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Incoming Calls</p>

                <h2 id="incomingCalls">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Missed Calls</p>

                <h2 id="missedCalls">
                    0
                </h2>

            </div>

        </div>


        <!-- Employee Report -->

        <div class="card">

            <div class="toolbar">

                <select id="dateFilter" class="filter">

                    <option value="ALL">
                        All Time
                    </option>

                    <option value="TODAY">
                        Today
                    </option>

                    <option value="WEEK">
                        This Week
                    </option>

                    <option value="MONTH">
                        This Month
                    </option>

                    <option value="CUSTOM">
                        Custom Date
                    </option>

                </select>

                <input type="date" id="fromDate" class="filter" style="display:none;">

                <input type="date" id="toDate" class="filter" style="display:none;">

                <button id="generateReport" class="refresh" style="display:none;" onclick="loadEmployeeReport()">

                    Generate Report

                </button>

                <button class="refresh" onclick="loadEmployeeReport()">

                    Refresh

                </button>

                <button class="refresh" onclick="exportReportToExcel()">

                    Export Excel

                </button>

                <button class="refresh" onclick="exportReportToPDF()">

                    Export PDF

                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Employee ID</th>

                            <th>Employee Name</th>

                            <th>Total Calls</th>

                            <th>Outgoing</th>

                            <th>Incoming</th>

                            <th>Missed</th>

                        </tr>

                    </thead>


                    <tbody id="reportTable">

                        <tr>

                            <td colspan="6" class="loading">

                                Loading employee statistics...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>



    <script>

        

        const API_URL =
            "http://localhost:8080";

        let employeeStats = [];


        function formatDateForAPI(date) {

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        const dateFilter =
            document.getElementById("dateFilter");

        const fromDate =
            document.getElementById("fromDate");

        const toDate =
            document.getElementById("toDate");

        const generateReport =
            document.getElementById("generateReport");


        dateFilter.addEventListener(
            "change",
            function () {

                if (this.value === "CUSTOM") {

                    fromDate.style.display = "block";
                    toDate.style.display = "block";
                    generateReport.style.display = "block";

                } else {

                    fromDate.style.display = "none";
                    toDate.style.display = "none";
                    generateReport.style.display = "none";

                    loadEmployeeReport();
                }

            }
        );

        // ==========================================
        // LOAD EMPLOYEE REPORT
        // ==========================================

        async function loadEmployeeReport() {

            const table =
                document.getElementById("reportTable");

            const filter =
                document.getElementById("dateFilter").value;

            table.innerHTML = `
        <tr>
            <td colspan="6" class="loading">
                Loading employee statistics...
            </td>
        </tr>
    `;

            try {

                let url =
                    `${API_URL}/api/call-logs/stats/employees`;

                // --------------------------------
                // DATE FILTER
                // --------------------------------

                if (filter !== "ALL") {

                    let fromDateValue;
                    let toDateValue;

                    const today = new Date();


                    if (filter === "TODAY") {

                        fromDateValue =
                            formatDateForAPI(today);

                        toDateValue =
                            formatDateForAPI(today);

                    }


                    else if (filter === "WEEK") {

                        const day =
                            today.getDay();

                        const difference =
                            day === 0 ? 6 : day - 1;

                        const monday =
                            new Date(today);

                        monday.setDate(
                            today.getDate() - difference
                        );

                        fromDateValue =
                            formatDateForAPI(monday);

                        toDateValue =
                            formatDateForAPI(today);

                    }


                    else if (filter === "MONTH") {

                        const firstDay =
                            new Date(
                                today.getFullYear(),
                                today.getMonth(),
                                1
                            );

                        fromDateValue =
                            formatDateForAPI(firstDay);

                        toDateValue =
                            formatDateForAPI(today);

                    }


                    else if (filter === "CUSTOM") {

                        fromDateValue =
                            fromDate.value;

                        toDateValue =
                            toDate.value;


                        if (!fromDateValue || !toDateValue) {

                            alert(
                                "Please select both From Date and To Date."
                            );

                            return;
                        }


                        if (fromDateValue > toDateValue) {

                            alert(
                                "From Date cannot be after To Date."
                            );

                            return;
                        }

                    }


                    url =
                        `${API_URL}/api/call-logs/stats/employees/date` +
                        `?from=${fromDateValue}&to=${toDateValue}`;
                }
                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Failed to load employee statistics"
                    );
                }


                employeeStats =
                    await response.json();


                displayEmployeeReport(
                    employeeStats
                );


                calculateTotals(
                    employeeStats
                );


            } catch (error) {

                console.error(error);

                table.innerHTML = `
            <tr>
                <td colspan="6" class="error">
                    Unable to load employee statistics.
                </td>
            </tr>
        `;

            }
        }
        // ==========================================
        // DISPLAY EMPLOYEE REPORT
        // ==========================================

        function displayEmployeeReport(data) {

            const table =
                document.getElementById(
                    "reportTable"
                );


            if (!data || data.length === 0) {

                table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No employee statistics found.
                </td>
            </tr>
        `;

                return;
            }


            table.innerHTML = "";


            data.forEach(employee => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

            <td>
                ${employee.employeeId}
            </td>

            <td class="employee-name">
                ${employee.employeeName}
            </td>

            <td class="number">
                ${employee.totalCalls}
            </td>

            <td>
                ${employee.outgoingCalls}
            </td>

            <td>
                ${employee.incomingCalls}
            </td>

            <td class="missed">
                ${employee.missedCalls}
            </td>

        `;


                table.appendChild(row);

            });

        }


        // ==========================================
        // CALCULATE TOTALS
        // ==========================================

        function calculateTotals(data) {

            let totalCalls = 0;
            let outgoingCalls = 0;
            let incomingCalls = 0;
            let missedCalls = 0;


            data.forEach(employee => {

                totalCalls +=
                    Number(employee.totalCalls || 0);

                outgoingCalls +=
                    Number(employee.outgoingCalls || 0);

                incomingCalls +=
                    Number(employee.incomingCalls || 0);

                missedCalls +=
                    Number(employee.missedCalls || 0);

            });


            document.getElementById(
                "totalCalls"
            ).textContent = totalCalls;


            document.getElementById(
                "outgoingCalls"
            ).textContent = outgoingCalls;


            document.getElementById(
                "incomingCalls"
            ).textContent = incomingCalls;


            document.getElementById(
                "missedCalls"
            ).textContent = missedCalls;

        }

        function exportReportToExcel() {

            if (!employeeStats || employeeStats.length === 0) {

                alert("No report data available to export.");

                return;
            }


            const exportData =
                employeeStats.map(employee => ({

                    "Employee ID":
                        employee.employeeId,

                    "Employee Name":
                        employee.employeeName,

                    "Total Calls":
                        employee.totalCalls,

                    "Outgoing Calls":
                        employee.outgoingCalls,

                    "Incoming Calls":
                        employee.incomingCalls,

                    "Missed Calls":
                        employee.missedCalls

                }));


            const worksheet =
                XLSX.utils.json_to_sheet(exportData);


            const workbook =
                XLSX.utils.book_new();


            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Employee Report"
            );


            const today =
                new Date().toISOString().split("T")[0];


            XLSX.writeFile(
                workbook,
                `Coverwell_Employee_Report_${today}.xlsx`
            );
        }

        document
            .getElementById("dateFilter")
            .addEventListener(
                "change",
                loadEmployeeReport
            );


        function exportReportToPDF() {

            if (!employeeStats || employeeStats.length === 0) {

                alert("No report data available to export.");

                return;
            }

            const { jsPDF } = window.jspdf;

            const doc = new jsPDF();

            // Title
            doc.setFontSize(18);

            doc.text(
                "Coverwell CRM",
                14,
                20
            );

            // Subtitle
            doc.setFontSize(12);

            doc.text(
                "Employee Call Report",
                14,
                29
            );

            // Date
            const today =
                new Date().toLocaleDateString("en-IN");

            doc.setFontSize(10);

            doc.text(
                `Generated: ${today}`,
                14,
                37
            );

            // Table
            const rows =
                employeeStats.map(employee => [

                    employee.employeeId,

                    employee.employeeName,

                    employee.totalCalls,

                    employee.outgoingCalls,

                    employee.incomingCalls,

                    employee.missedCalls

                ]);

            doc.autoTable({

                startY: 45,

                head: [[
                    "Employee ID",
                    "Employee Name",
                    "Total Calls",
                    "Outgoing",
                    "Incoming",
                    "Missed"
                ]],

                body: rows,

                theme: "grid",

                styles: {
                    fontSize: 9
                },

                headStyles: {
                    fontStyle: "bold"
                }

            });

            // Download
            doc.save(
                `Coverwell_Employee_Report_${today.replace(/\//g, "-")}.pdf`
            );
        }
        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadEmployeeReport();
        // loadEmployeeReport();

    </script>
    <script src="js/sidebar.js"></script>

</body>

</html>
