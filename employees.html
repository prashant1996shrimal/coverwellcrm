<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coverwell CRM - Employees</title>
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        } */

        /* MAIN */

        .main {
            margin-left: 240px;
            min-height: 100vh;
        } 

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title h1 {
            color: #1e293b;
            font-size: 28px;
        }

        .title p {
            color: #64748b;
            margin-top: 6px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .back-button,
        .add-button {
            border: none;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button {
            background: #0f172a;
        }

        .add-button {
            background: #2563eb;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        /* STATISTICS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .stat-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            color: #1e293b;
            font-size: 28px;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        /* TOOLBAR */

        .toolbar {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .search {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f8fafc;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 16px 15px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover {
            background: #f8fafc;
        }

        .employee-name {
            font-weight: bold;
            color: #1e293b;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #15803d;
        }

        .inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        .role {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 40px;
        }

        .loading,
        .empty {
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-box h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-button,
        .save-button {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #334155;
        }

        .save-button {
            background: #2563eb;
            color: white;
        }

        .message {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <div id="sidebar-container"></div>
<main class="main">

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <div class="title">

                <h1>Employees</h1>

                <p>
                    Manage Coverwell Group employees
                </p>

            </div>


            <div class="header-buttons">

                <button class="add-button" onclick="openModal()">

                    + Add Employee

                </button>

            </div>

        </div>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">

                <p>Total Employees</p>

                <h2 id="totalEmployees">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Active</p>

                <h2 id="activeEmployees">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Inactive</p>

                <h2 id="inactiveEmployees">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Employee Roles</p>

                <h2 id="employeeRoles">
                    0
                </h2>

            </div>

        </div>


        <!-- EMPLOYEE TABLE -->

        <div class="card">

            <div class="toolbar">

                <input type="text" id="search" class="search" placeholder="Search by name, email or phone...">

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Employee</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Created</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="employeeTable">

                        <tr>

                            <td colspan="8" class="loading">

                                Loading employees...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ADD EMPLOYEE MODAL -->

    <div class="modal" id="employeeModal">

        <div class="modal-box">

            <h2>
                Add Employee
            </h2>


            <form id="employeeForm">

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input type="text" id="employeeName" required placeholder="Enter employee name">

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input type="email" id="employeeEmail" required placeholder="Enter email">

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input type="text" id="employeePhone" required placeholder="Enter phone number">

                </div>


                <div class="form-group">

                    <label>
                        Role
                    </label>

                    <select id="employeeRole">

                        <option value="EMPLOYEE">
                            EMPLOYEE
                        </option>

                        <option value="ADMIN">
                            ADMIN
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="employeeStatus">

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>


                <div class="message" id="formMessage">
                </div>


                <div class="modal-buttons">

                    <button type="button" class="cancel-button" onclick="closeModal()">

                        Cancel

                    </button>


                    <button type="submit" class="save-button">

                        Save Employee

                    </button>

                </div>

            </form>

        </div>

    </div>
</main>

    <script>

        const API_URL =
            "http://localhost:8080";

        let employees = [];


        // LOAD EMPLOYEES

        async function loadEmployees() {

            const table =
                document.getElementById(
                    "employeeTable"
                );


            table.innerHTML = `
        <tr>
            <td colspan="8"
                class="loading">
                Loading employees...
            </td>
        </tr>
    `;


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/employees`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load employees"
                    );

                }


                employees =
                    await response.json();


                updateStatistics(
                    employees
                );


                displayEmployees(
                    employees
                );


            } catch (error) {

                console.error(error);


                table.innerHTML = `
            <tr>
                <td colspan="8"
                    class="error">
                    Unable to load employees.
                </td>
            </tr>
        `;

            }

        }


        // STATISTICS

        function updateStatistics(data) {

            document.getElementById(
                "totalEmployees"
            ).textContent =
                data.length;


            document.getElementById(
                "activeEmployees"
            ).textContent =
                data.filter(
                    employee =>
                        employee.status === "ACTIVE"
                ).length;


            document.getElementById(
                "inactiveEmployees"
            ).textContent =
                data.filter(
                    employee =>
                        employee.status === "INACTIVE"
                ).length;


            const roles =
                new Set(
                    data.map(
                        employee =>
                            employee.role
                    )
                );


            document.getElementById(
                "employeeRoles"
            ).textContent =
                roles.size;

        }


        // DISPLAY EMPLOYEES

        function displayEmployees(data) {

            const table =
                document.getElementById(
                    "employeeTable"
                );


            if (!data || data.length === 0) {

                table.innerHTML = `
            <tr>
                <td colspan="8"
                    class="empty">
                    No employees found.
                </td>
            </tr>
        `;

                return;

            }


            table.innerHTML = "";


            data.forEach(employee => {

                const row =
                    document.createElement("tr");


                const statusClass =
                    employee.status === "ACTIVE"
                        ? "active"
                        : "inactive";


                row.innerHTML = `
    <td>
        ${employee.id}
    </td>

    <td class="employee-name">
        ${employee.name}
    </td>

    <td>
        ${employee.email}
    </td>

    <td>
        ${employee.phone}
    </td>

    <td>
        <span class="badge role">
            ${employee.role}
        </span>
    </td>

    <td>
        <span class="badge ${statusClass}">
            ${employee.status}
        </span>
    </td>

    <td>
        ${formatDate(employee.createdAt)}
    </td>

    <td>
        <a
            href="employee-details.html?id=${employee.id}"
            style="
                color:#2563eb;
                text-decoration:none;
                font-weight:bold;
            "
        >
            View
        </a>
    </td>
`;

                table.appendChild(row);

            });

        }


        // FORMAT DATE

        function formatDate(dateString) {

            if (!dateString) {
                return "-";
            }


            return new Date(
                dateString
            ).toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // SEARCH

        document
            .getElementById("search")
            .addEventListener(
                "input",
                function () {

                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        employees.filter(
                            employee =>

                                employee.name
                                    .toLowerCase()
                                    .includes(search)

                                ||

                                employee.email
                                    .toLowerCase()
                                    .includes(search)

                                ||

                                String(
                                    employee.phone
                                ).includes(search)
                        );


                    displayEmployees(
                        filtered
                    );

                }
            );


        // MODAL

        function openModal() {

            document.getElementById(
                "employeeModal"
            ).style.display =
                "flex";

        }


        function closeModal() {

            document.getElementById(
                "employeeModal"
            ).style.display =
                "none";


            document.getElementById(
                "employeeForm"
            ).reset();


            document.getElementById(
                "formMessage"
            ).textContent = "";

        }


        // ADD EMPLOYEE

        document
            .getElementById("employeeForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const employee = {

                        name:
                            document.getElementById(
                                "employeeName"
                            ).value.trim(),

                        email:
                            document.getElementById(
                                "employeeEmail"
                            ).value.trim(),

                        phone:
                            document.getElementById(
                                "employeePhone"
                            ).value.trim(),

                        role:
                            document.getElementById(
                                "employeeRole"
                            ).value,

                        status:
                            document.getElementById(
                                "employeeStatus"
                            ).value

                    };


                    const formMessage =
                        document.getElementById(
                            "formMessage"
                        );


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/api/employees`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            employee
                                        )
                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Failed to create employee"
                            );

                        }


                        formMessage.style.color =
                            "#16a34a";

                        formMessage.textContent =
                            "Employee created successfully.";


                        await loadEmployees();


                        setTimeout(
                            closeModal,
                            700
                        );


                    } catch (error) {

                        console.error(error);


                        formMessage.style.color =
                            "#dc2626";

                        formMessage.textContent =
                            "Unable to create employee.";

                    }

                }
            );


        // START

        loadEmployees();

    </script>
    <script src="js/sidebar.js"></script>

</body>

</html>
